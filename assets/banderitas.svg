<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 58" preserveAspectRatio="none" width="100%" height="58">
  <defs>
    <!-- Realistic Shadow -->
    <filter id="pennantShadow" x="-20%" y="-10%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.38"/>
    </filter>
    
    <!-- Rich Festival Satin Gradients -->
    <linearGradient id="satRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a3b"/>
      <stop offset="50%" stop-color="#e6192c"/>
      <stop offset="100%" stop-color="#a80b1a"/>
    </linearGradient>
    
    <linearGradient id="satGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="45%" stop-color="#ffca28"/>
      <stop offset="100%" stop-color="#f57f17"/>
    </linearGradient>
    
    <linearGradient id="satBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42a5f5"/>
      <stop offset="55%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
    
    <linearGradient id="satGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    
    <linearGradient id="satOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="60%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#bf360c"/>
    </linearGradient>

    <linearGradient id="satPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ce93d8"/>
      <stop offset="50%" stop-color="#ab47bc"/>
      <stop offset="100%" stop-color="#4a148c"/>
    </linearGradient>

    <linearGradient id="satCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4dd0e1"/>
      <stop offset="60%" stop-color="#00acc1"/>
      <stop offset="100%" stop-color="#006064"/>
    </linearGradient>
  </defs>

  <!-- LAYER 1: Deep Background Sag Rope and Flags -->
  <path d="M-10,5 Q100,26 200,5 Q300,26 410,5" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1.4" stroke-dasharray="4,2"/>
  
  <g filter="url(#pennantShadow)" opacity="0.82">
    <!-- Back tier flags -->
    <polygon points="20,11 36,13 28,34" fill="url(#satPurple)"/>
    <polygon points="46,15 62,17 54,39" fill="url(#satGold)"/>
    <polygon points="72,18 88,19 80,41" fill="url(#satRed)"/>
    <polygon points="98,20 114,20 106,42" fill="url(#satGreen)"/>
    <polygon points="124,19 140,18 132,40" fill="url(#satCyan)"/>
    <polygon points="150,17 166,15 158,37" fill="url(#satOrange)"/>
    <polygon points="176,13 192,11 184,33" fill="url(#satBlue)"/>

    <polygon points="220,11 236,13 228,34" fill="url(#satGold)"/>
    <polygon points="246,15 262,17 254,39" fill="url(#satGreen)"/>
    <polygon points="272,18 288,19 280,41" fill="url(#satRed)"/>
    <polygon points="298,20 314,20 306,42" fill="url(#satPurple)"/>
    <polygon points="324,19 340,18 332,40" fill="url(#satBlue)"/>
    <polygon points="350,17 366,15 358,37" fill="url(#satOrange)"/>
    <polygon points="376,13 392,11 384,33" fill="url(#satGold)"/>
  </g>

  <!-- LAYER 2: Foreground Primary Festoon Hanging Rope -->
  <path d="M-10,0 Q100,22 200,0 Q300,22 410,0" fill="none" stroke="#fff9e6" stroke-width="2.2" filter="url(#pennantShadow)"/>
  
  <!-- Main Larger Banderitas Pennants (Triangles & Swallowtails with subtle decorative cut) -->
  <g filter="url(#pennantShadow)">
    <!-- 1: Red Swallowtail -->
    <path d="M4,1 L26,5 L15,40 L26,46 L4,40 Z" fill="url(#satRed)"/>
    <!-- 2: Gold Pennant -->
    <polygon points="29,5 51,9 40,43" fill="url(#satGold)"/>
    <!-- 3: Blue Swallowtail -->
    <path d="M54,10 L76,14 L65,47 L76,53 L54,47 Z" fill="url(#satBlue)"/>
    <!-- 4: Green Triangle -->
    <polygon points="79,14 101,16 90,50" fill="url(#satGreen)"/>
    <!-- 5: Orange Swallowtail -->
    <path d="M104,16 L126,15 L115,51 L126,56 L104,51 Z" fill="url(#satOrange)"/>
    <!-- 6: Gold / Yellow Triangle -->
    <polygon points="129,15 151,12 140,48" fill="url(#satGold)"/>
    <!-- 7: Purple Swallowtail -->
    <path d="M154,11 L176,7 L165,44 L176,49 L154,44 Z" fill="url(#satPurple)"/>
    <!-- 8: Red Triangle -->
    <polygon points="179,7 201,2 190,41" fill="url(#satRed)"/>

    <!-- Second Half Repeat (200 to 400) -->
    <!-- 9: Green Swallowtail -->
    <path d="M204,1 L226,5 L215,40 L226,46 L204,40 Z" fill="url(#satGreen)"/>
    <!-- 10: Orange Triangle -->
    <polygon points="229,5 251,9 240,43" fill="url(#satOrange)"/>
    <!-- 11: Yellow Swallowtail -->
    <path d="M254,10 L276,14 L265,47 L276,53 L254,47 Z" fill="url(#satGold)"/>
    <!-- 12: Blue Triangle -->
    <polygon points="279,14 301,16 290,50" fill="url(#satBlue)"/>
    <!-- 13: Red Swallowtail -->
    <path d="M304,16 L326,15 L315,51 L326,56 L304,51 Z" fill="url(#satRed)"/>
    <!-- 14: Purple Triangle -->
    <polygon points="329,15 351,12 340,48" fill="url(#satPurple)"/>
    <!-- 15: Gold Swallowtail -->
    <path d="M354,11 L376,7 L365,44 L376,49 L354,44 Z" fill="url(#satGold)"/>
    <!-- 16: Green Triangle -->
    <polygon points="379,7 401,2 390,41" fill="url(#satGreen)"/>
  </g>
</svg>
